name: Deploy to itch.io

on:
  push:
    branches: [master]

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: antoine-flo/templegamebis

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download Godot editor
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot_bin
          chmod +x godot_bin

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install Blender
        env:
          BLENDER_VERSION: 4.2.9
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      - name: Configure Blender path for headless import
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "$HOME/blender/blender"
          EOF

      - name: Import project resources
        run: ./godot_bin --headless --editor --quit --path .

      - name: Export Web build
        run: |
          mkdir -p build/web
          ./godot_bin --headless --export-release "Web" build/web/index.html --path .

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler push build/web ${ITCH_TARGET}:html5 --userversion "${{ github.sha }}"
